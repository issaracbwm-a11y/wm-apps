<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3a6b"/>
      <stop offset="1" stop-color="#0d7a6f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#f2a900"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background (iOS/Android round the corners themselves) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="190" fill="#ffffff" opacity="0.06"/>

  <!-- balance scale -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <line x1="256" y1="92" x2="256" y2="300" stroke-width="16"/>
    <line x1="128" y1="128" x2="384" y2="128" stroke-width="16"/>
    <!-- strings -->
    <path d="M128 128 L88 222 M128 128 L168 222" stroke-width="7"/>
    <path d="M384 128 L344 222 M384 128 L424 222" stroke-width="7"/>
  </g>
  <circle cx="256" cy="92" r="16" fill="url(#gold)"/>
  <!-- pans -->
  <path d="M78 222 H178 A50 50 0 0 1 78 222 Z" fill="#ffffff"/>
  <path d="M334 222 H434 A50 50 0 0 1 334 222 Z" fill="#ffffff"/>
  <!-- base -->
  <rect x="196" y="296" width="120" height="16" rx="8" fill="#ffffff"/>

  <!-- progress bar chart card -->
  <rect x="96" y="338" width="320" height="128" rx="24" fill="#ffffff"/>
  <rect x="124" y="410" width="34" height="34" rx="6" fill="#e2534a"/>
  <rect x="170" y="390" width="34" height="54" rx="6" fill="#f5b400"/>
  <rect x="216" y="368" width="34" height="76" rx="6" fill="#1fa463"/>
  <!-- target line -->
  <line x1="120" y1="372" x2="256" y2="372" stroke="#0b3a6b" stroke-width="4" stroke-dasharray="8 6"/>
  <!-- FY label -->
  <text x="340" y="432" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="76" fill="#0b3a6b">70</text>
</svg>
