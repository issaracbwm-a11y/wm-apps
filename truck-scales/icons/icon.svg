<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ไอคอนทะเบียนและแผนตรวจเครื่องชั่งรถยนต์: แผนที่จุดตรวจ + หมุดตำแหน่งที่มีรถบรรทุกบนแท่นชั่ง (ออกแบบเอง) -->
  <rect width="512" height="512" fill="#12352f"/>
  <!-- แผนที่พับ 3 ทบ -->
  <path d="M64 150 L176 116 L304 150 L448 116 V410 L304 444 L176 410 L64 444 Z" fill="#e8efe9"/>
  <path d="M176 116 V410 L64 444 V150 Z" fill="#d3ded6"/>
  <path d="M304 150 L448 116 V410 L304 444 Z" fill="#d3ded6"/>
  <!-- ถนน/เส้นทาง -->
  <path d="M80 380 C150 340 170 300 240 300 S340 330 430 250" fill="none" stroke="#9fb7aa" stroke-width="14" stroke-linecap="round"/>
  <path d="M120 200 L230 240 L300 210 L420 190" fill="none" stroke="#9fb7aa" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 18"/>
  <!-- จุดตรวจอื่น ๆ -->
  <circle cx="110" cy="250" r="14" fill="#2f6b5f"/><circle cx="400" cy="330" r="14" fill="#2f6b5f"/><circle cx="350" cy="190" r="12" fill="#c0392b"/>
  <!-- หมุดหลัก -->
  <path d="M256 412 C220 360 168 304 168 240 A88 88 0 0 1 344 240 C344 304 292 360 256 412 Z" fill="#d9b45a" stroke="#12352f" stroke-width="10"/>
  <circle cx="256" cy="240" r="62" fill="#12352f"/>
  <!-- รถบรรทุกบนแท่นชั่ง ในหมุด -->
  <g fill="#ffffff">
    <rect x="214" y="214" width="52" height="34" rx="3"/>
    <path d="M270 226 H286 L298 240 V248 H270 Z"/>
  </g>
  <circle cx="226" cy="252" r="7" fill="#ffffff"/><circle cx="252" cy="252" r="7" fill="#ffffff"/><circle cx="288" cy="252" r="7" fill="#ffffff"/>
  <rect x="206" y="262" width="100" height="8" rx="2" fill="#d9b45a"/>
</svg>
