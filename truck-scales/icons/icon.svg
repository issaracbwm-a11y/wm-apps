<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ไอคอนทะเบียนและแผนตรวจเครื่องชั่งรถยนต์: รถบรรทุกบนแท่นชั่ง + หน้าจอแสดงน้ำหนัก (ออกแบบเอง) -->
  <rect width="512" height="512" fill="#12352f"/>
  <!-- หน้าจอแสดงค่า -->
  <rect x="300" y="78" width="150" height="70" rx="12" fill="#0b2420" stroke="#d9b45a" stroke-width="8"/>
  <text x="375" y="128" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="42" font-weight="700" fill="#d9b45a">kg</text>
  <path d="M375 148 V190" stroke="#d9b45a" stroke-width="8"/>
  <!-- รถบรรทุก -->
  <g fill="#ffffff">
    <rect x="70" y="190" width="230" height="128" rx="10"/>
    <path d="M312 230 H382 L432 282 V318 H312 Z" />
  </g>
  <path d="M330 246 H376 L406 280 H330 Z" fill="#12352f"/>
  <g fill="#12352f" stroke="#ffffff" stroke-width="12">
    <circle cx="130" cy="330" r="30"/><circle cx="220" cy="330" r="30"/><circle cx="380" cy="330" r="30"/>
  </g>
  <!-- แท่นชั่ง -->
  <rect x="40" y="360" width="432" height="34" rx="6" fill="#d9b45a"/>
  <rect x="62" y="394" width="26" height="34" fill="#d9b45a"/><rect x="424" y="394" width="26" height="34" fill="#d9b45a"/>
  <path d="M40 450 H472" stroke="#2f6b5f" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 22"/>
</svg>
